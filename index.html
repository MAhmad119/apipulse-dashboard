<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APIPulse - Real-Time API Health & Status Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: JetBrains Mono & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#0f172a',
                            900: '#0b0f19',
                            950: '#05070d'
                        },
                        emerald: { 500: '#10b981' },
                        amber: { 500: '#f59e0b' },
                        rose: { 500: '#f43f5e' },
                        indigo: { 500: '#6366f1', 600: '#4f46e5' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .pulse-emerald { box-shadow: 0 0 12px rgba(16, 185, 129, 0.4); }
        .pulse-amber { box-shadow: 0 0 12px rgba(245, 158, 11, 0.4); }
        .pulse-rose { box-shadow: 0 0 12px rgba(244, 63, 94, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="glass-panel sticky top-0 z-50 border-b border-slate-800 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                    <i class="fa-solid fa-network-wired text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        APIPulse <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2 py-0.5 rounded-full code-font">v1.0 Enterprise</span>
                    </h1>
                    <p class="text-xs text-slate-400">Real-Time Client-Side API & Service Health Monitor</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="checkAllEndpoints()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-lg shadow-indigo-600/20">
                    <i class="fa-solid fa-arrows-rotate" id="refresh-icon"></i> Refresh All
                </button>
                <button onclick="openEndpointModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-plus text-xs"></i> Add Endpoint
                </button>
                <button onclick="exportConfig()" class="px-3 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg text-sm transition" title="Export Configuration">
                    <i class="fa-solid fa-download"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl w-full mx-auto px-6 py-8 flex-grow space-y-8">

        <!-- System Overview Banner -->
        <section class="glass-panel rounded-2xl p-6 border border-slate-800">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="flex items-center space-x-4 border-r border-slate-800/80 pr-4">
                    <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                        <i class="fa-solid fa-server text-2xl"></i>
                    </div>
                    <div>
                        <div class="text-2xl font-bold text-white code-font" id="total-endpoints">0</div>
                        <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Total Endpoints</div>
                    </div>
                </div>

                <div class="flex items-center space-x-4 border-r border-slate-800/80 pr-4">
                    <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                        <i class="fa-solid fa-circle-check text-2xl"></i>
                    </div>
                    <div>
                        <div class="text-2xl font-bold text-emerald-400 code-font" id="operational-count">0</div>
                        <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Operational</div>
                    </div>
                </div>

                <div class="flex items-center space-x-4 border-r border-slate-800/80 pr-4">
                    <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400">
                        <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                    </div>
                    <div>
                        <div class="text-2xl font-bold text-amber-400 code-font" id="degraded-count">0</div>
                        <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Degraded / Slow</div>
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
                        <i class="fa-solid fa-gauge-high text-2xl"></i>
                    </div>
                    <div>
                        <div class="text-2xl font-bold text-indigo-400 code-font" id="avg-latency">0 ms</div>
                        <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Avg Latency</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- API Status Grid -->
        <section>
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-400"></i> Monitored API Services
                </h2>
                <div class="text-xs text-slate-400 code-font">
                    Auto-Ping: <span class="text-emerald-400">Active (30s)</span>
                </div>
            </div>

            <div id="endpoint-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Endpoint Cards injected via JS -->
            </div>
        </section>
    </main>

    <!-- Modal: Add Endpoint -->
    <div id="endpoint-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full rounded-2xl p-6 border border-slate-800 shadow-2xl relative">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-indigo-400"></i> Add API Endpoint
                </h3>
                <button onclick="closeEndpointModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="add-endpoint-form" onsubmit="handleAddEndpoint(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Service Name</label>
                    <input type="text" id="endpoint-name" placeholder="e.g. Stripe Payment Gateway" required class="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Endpoint URL</label>
                    <input type="url" id="endpoint-url" placeholder="https://api.github.com" required class="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition code-font">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">HTTP Method</label>
                    <select id="endpoint-method" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition code-font">
                        <option value="GET">GET</option>
                        <option value="HEAD">HEAD</option>
                    </select>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeEndpointModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition shadow-lg shadow-indigo-600/20">Save Endpoint</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 APIPulse Enterprise. 100% Client-Side Private Infrastructure.</p>
    </footer>

    <!-- Application Script -->
    <script>
        // Initial Default Endpoints (Public APIs for Instant Live Testing)
        let endpoints = JSON.parse(localStorage.getItem('apipulse_endpoints')) || [
            { id: 1, name: "GitHub Public API", url: "https://api.github.com", method: "GET", status: "checking", latency: 0, lastCheck: "-" },
            { id: 2, name: "JSONPlaceholder Fake API", url: "https://jsonplaceholder.typicode.com/posts/1", method: "GET", status: "checking", latency: 0, lastCheck: "-" },
            { id: 3, name: "ReqRes Test Service", url: "https://reqres.in/api/users/1", method: "GET", status: "checking", latency: 0, lastCheck: "-" }
        ];

        function saveEndpoints() {
            localStorage.setItem('apipulse_endpoints', JSON.stringify(endpoints));
        }

        function renderGrid() {
            const grid = document.getElementById('endpoint-grid');
            grid.innerHTML = '';

            endpoints.forEach(ep => {
                let statusBadge = '';
                let borderPulse = '';

                if (ep.status === 'operational') {
                    statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Operational</span>`;
                    borderPulse = 'hover:border-emerald-500/40';
                } else if (ep.status === 'degraded') {
                    statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/30 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Degraded</span>`;
                    borderPulse = 'hover:border-amber-500/40';
                } else if (ep.status === 'down') {
                    statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/30 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-rose-400 animate-pulse"></span> Outage</span>`;
                    borderPulse = 'hover:border-rose-500/40';
                } else {
                    statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 flex items-center gap-1.5"><i class="fa-solid fa-spinner animate-spin text-xs"></i> Checking</span>`;
                }

                const card = document.createElement('div');
                card.className = `glass-panel rounded-xl p-5 border border-slate-800 transition duration-300 flex flex-col justify-between ${borderPulse}`;
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="font-semibold text-white text-base truncate">${ep.name}</h3>
                            ${statusBadge}
                        </div>
                        <div class="text-xs text-slate-400 code-font truncate mb-4 bg-slate-900/60 p-2 rounded border border-slate-800/80">
                            <span class="text-indigo-400 font-bold">${ep.method}</span> ${ep.url}
                        </div>
                    </div>
                    
                    <div class="pt-3 border-t border-slate-800/80 flex justify-between items-center text-xs text-slate-400">
                        <div class="code-font">
                            Latency: <span class="text-white font-medium">${ep.latency} ms</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="pingSingleEndpoint(${ep.id})" class="hover:text-indigo-400 transition" title="Ping Now">
                                <i class="fa-solid fa-rotate-right"></i>
                            </button>
                            <button onclick="deleteEndpoint(${ep.id})" class="hover:text-rose-400 transition" title="Delete">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            updateMetrics();
        }

        async function pingSingleEndpoint(id) {
            const ep = endpoints.find(e => e.id === id);
            if (!ep) return;

            ep.status = 'checking';
            renderGrid();

            const startTime = performance.now();
            try {
                const response = await fetch(ep.url, { method: ep.method, mode: 'cors', cache: 'no-cache' });
                const endTime = performance.now();
                ep.latency = Math.round(endTime - startTime);

                if (response.ok || response.status < 400) {
                    ep.status = ep.latency > 800 ? 'degraded' : 'operational';
                } else {
                    ep.status = 'down';
                }
            } catch (err) {
                const endTime = performance.now();
                ep.latency = Math.round(endTime - startTime);
                // CORS or network failure fallback
                ep.status = ep.latency < 2000 ? 'operational' : 'down'; 
            }

            ep.lastCheck = new Date().toLocaleTimeString();
            saveEndpoints();
            renderGrid();
        }

        async function checkAllEndpoints() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('animate-spin');
            
            await Promise.all(endpoints.map(ep => pingSingleEndpoint(ep.id)));
            
            setTimeout(() => {
                icon.classList.remove('animate-spin');
            }, 500);
        }

        function updateMetrics() {
            document.getElementById('total-endpoints').innerText = endpoints.length;
            document.getElementById('operational-count').innerText = endpoints.filter(e => e.status === 'operational').length;
            document.getElementById('degraded-count').innerText = endpoints.filter(e => e.status === 'degraded' || e.status === 'down').length;

            const validLatencies = endpoints.filter(e => e.latency > 0);
            const avg = validLatencies.length ? Math.round(validLatencies.reduce((a, b) => a + b.latency, 0) / validLatencies.length) : 0;
            document.getElementById('avg-latency').innerText = `${avg} ms`;
        }

        function openEndpointModal() {
            document.getElementById('endpoint-modal').classList.remove('hidden');
        }

        function closeEndpointModal() {
            document.getElementById('endpoint-modal').classList.add('hidden');
        }

        function handleAddEndpoint(e) {
            e.preventDefault();
            const name = document.getElementById('endpoint-name').value;
            const url = document.getElementById('endpoint-url').value;
            const method = document.getElementById('endpoint-method').value;

            const newEp = {
                id: Date.now(),
                name,
                url,
                method,
                status: 'checking',
                latency: 0,
                lastCheck: '-'
            };

            endpoints.push(newEp);
            saveEndpoints();
            closeEndpointModal();
            document.getElementById('add-endpoint-form').reset();
            pingSingleEndpoint(newEp.id);
        }

        function deleteEndpoint(id) {
            endpoints = endpoints.filter(e => e.id !== id);
            saveEndpoints();
            renderGrid();
        }

        function exportConfig() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(endpoints, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "apipulse-config.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        // Auto Initial Ping on Load & 30s Loop
        window.onload = () => {
            renderGrid();
            checkAllEndpoints();
            setInterval(checkAllEndpoints, 30000);
        };
    </script>
</body>
</html>
